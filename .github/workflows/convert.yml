- name: Run conversion
        env:
          INPUT_FILE: ${{ github.event.inputs.file_path != '' && github.event.inputs.file_path || 'inputs/sample.pdf' }}
        run: |
          echo "Using input file: ${INPUT_FILE}"
          if [ -f "${INPUT_FILE}" ]; then
            echo "Found ${INPUT_FILE} in repo"
            INPUT_LOCAL="${INPUT_FILE}"
          elif echo "${INPUT_FILE}" | grep -E '^https?://' >/dev/null 2>&1; then
            echo "INPUT_FILE looks like a URL — attempting to download"
            wget -q -O /tmp/inputfile "${INPUT_FILE}" || { echo "Download failed"; exit 1; }
            INPUT_LOCAL=/tmp/inputfile
          else
            echo "File ${INPUT_FILE} not found in repo. Available files in inputs/:"
            ls -la inputs || true
            echo "If you intended to use a file in the repo, commit it at that path or pass a valid file_path."
            exit 1
          fi

          OUTDIR=out_results
          mkdir -p "$OUTDIR"
          python3 main.py "${INPUT_LOCAL}" "${OUTDIR}"
          name: dxf-results
          path: out_results/*.dxf
